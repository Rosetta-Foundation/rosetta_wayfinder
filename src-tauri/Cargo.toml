[package]
name = "wayfinder"
version = "0.1.0"
description = "Wayfinder — the local-first knowledge guide of the Rosetta platform."
authors = [
    "Russ Watson <russ@bakerstreet.engineering>",
    "Addi M <russ+adjutant@bakerstreet.engineering>",
]
edition = "2021"

[lib]
# The library name the Tauri app entry point references.
name = "wayfinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
